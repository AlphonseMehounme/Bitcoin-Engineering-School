{% extends 'base.html' %}
{% block body %}
<form method='POST' action='/signupres'>
<table>
<p>Sign up to access course</p>
<tr><td>First Name:</td><td><input name="first_name" type="text"></td></tr>
<tr><td>Last Name:</td><td><input name="last_name" type="text"></td></tr>
<tr><td>Username:</td><td><input name="username" type="text"></td></tr>
<tr><td>Email:</td><td><input name="email" type="email"></td></tr>
<tr><td>Password:</td><td><input name="password" type="text"></td></tr>
<tr><td>Github Username</td><td><input name="git_username" type="text"></td></tr>
</table>
<p>
    <button><input value='Sigup' type='SUBMIT'></button>
</p>
</form>
<button id="signuplogin">Have an account ? Login</button>
{% endblock %}
